# Destination clusters. bbox = [south, west, north, east] in degrees (WGS84).
# Boxes are approximate and meant to be tuned. Nesting is allowed: a provider
# is assigned to the smallest box that contains it, so Havelock beats Andaman.
#
#   mode: travel (tourist destination) | local (city, "Local mode")

destinations:
  # Andaman & Nicobar: the launch wedge
  - {id: andaman, name: Andaman Islands, state: IN-AN, kind: island, mode: travel, bbox: [10.50, 92.20, 13.70, 93.10]}
  - {id: havelock, name: Havelock (Swaraj Dweep), state: IN-AN, kind: island, mode: travel, bbox: [11.93, 92.93, 12.08, 93.07]}
