# Experience taxonomy. Every provider gets one or more leaf categories.
#
#   mode:     travel (episodic, high-ticket) | weekend (recurring, social) | everyday (habitual)
#   kind:     operator (runs the experience) | venue (place you go) | agency (resells others)
#   osm:      OpenStreetMap tag matchers, "key=value" or "key=*"
#   keywords: whole-word matches against the business name (lowercase)
#
# Parents group leaves for reporting; only leaves are assigned.

groups:
  - id: water
    name: Water
    children:
      - {id: scuba_diving, name: Scuba diving, mode: travel,
         osm: [shop=scuba_diving, sport=scuba_diving, amenity=dive_centre],
         keywords: [scuba, diving, divers, dive centre, dive center, dive shop, padi]}
      - {id: snorkelling, name: Snorkelling, mode: travel,
         osm: [sport=snorkelling],
         keywords: [snorkel, snorkeling, snorkelling]}
      - {id: boat_tours, name: Boat tours & cruises, mode: travel,
         osm: [amenity=boat_rental, tourism=boat_tour],
         keywords: [boat tour, boat trip, cruise, cruises, houseboat, houseboats, glass bottom, shikara, yacht, yachts]}
      - {id: water_sports, name: Water sports, mode: travel,
         osm: [sport=water_ski, sport=surfing, sport=kitesurfing, sport=windsurfing, sport=canoe,
               sport=sailing, shop=water_sports, leisure=water_sports],
         keywords: [water sports, watersports, surf, surfing, kayak, kayaking, parasailing, jet ski, sup, paddle, sailing]}
      - {id: rafting, name: River rafting, mode: travel,
         osm: [sport=rafting, whitewater=*],
         keywords: [rafting, white water]}
      - {id: fishing, name: Fishing, mode: travel,
         osm: [leisure=fishing, sport=fishing],
         keywords: [angling, fishing]}

  - id: adventure
