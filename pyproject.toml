[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trigo-supply"
version = "0.1.0"
description = "Yuvoy India experience-supply database"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "phonenumbers>=8.13",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trigo-supply = "trigo_supply.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
